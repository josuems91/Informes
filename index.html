<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Carga de Informes D2</title>
  
  <link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/1OL4fcqW6-tv4hJ5PSO7fMdtME0pOF1nU">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#1a365d">
  <link rel="manifest" href="manifest.json">

  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #f3f4f6;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-2 sm:p-4">

  <!-- Card Principal (Login y Validación) -->
  <div id="card-validacion" class="bg-white rounded-2xl shadow-xl w-full max-w-md p-6 border border-gray-200 my-auto">
    
    <!-- Encabezado -->
    <div class="text-center mb-6">
      <img src="https://lh3.googleusercontent.com/d/1OL4fcqW6-tv4hJ5PSO7fMdtME0pOF1nU" alt="Escudo D2" class="w-20 h-20 mx-auto mb-2 object-contain">
      <h1 class="text-xl font-bold text-blue-900">Distrito 2 - Costa Rica</h1>
      <p class="text-xs text-gray-500">Validación de Perfil Ministerial</p>
    </div>

    <!-- Módulo 1: Consulta de Correo y Contraseña -->
    <div id="seccion-login" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-gray-700 mb-1">Correo Institucional</label>
        <input type="email" id="input-correo" placeholder="ejemplo@lldm.org" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm text-gray-800">
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-700 mb-1">Contraseña</label>
        <input type="password" id="input-pass" placeholder="••••••••" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm text-gray-800">
      </div>
      
      <button onclick="validarCorreo()" id="btn-validar" class="w-full bg-blue-900 hover:bg-blue-800 text-white font-semibold py-2.5 rounded-lg transition duration-200 shadow-md">
        Ingresar / Validar Perfil
      </button>

      <div id="mensaje-estado" class="text-xs text-center hidden p-2 rounded-lg"></div>
    </div>

    <!-- Módulo 2: Vista de Perfil Detectado -->
    <div id="seccion-perfil" class="hidden space-y-4 border-t pt-4 mt-4">
      <div class="bg-blue-50 p-4 rounded-xl border border-blue-200 space-y-2 text-sm">
        <p><span class="font-bold text-blue-900">Iglesia:</span> <span id="perfil-iglesia" class="text-gray-800"></span></p>
        <p><span class="font-bold text-blue-900">Ministro:</span> <span id="perfil-ministro" class="text-gray-800"></span></p>
        <p><span class="font-bold text-blue-900">Grado:</span> <span id="perfil-grado" class="text-gray-800"></span></p>
        <p><span class="font-bold text-blue-900">Rol de Acceso:</span> <span id="perfil-rol" class="inline-block px-2 py-0.5 text-xs font-semibold rounded bg-blue-200 text-blue-900"></span></p>
      </div>

      <button onclick="irAFormulario()" class="w-full bg-green-700 hover:bg-green-800 text-white font-semibold py-2.5 rounded-lg transition duration-200 shadow-md flex items-center justify-center gap-2">
        <span>Continuar al Formulario de Informe</span>
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
        </svg>
      </button>
    </div>

  </div>

  <!-- Contenedor del Formulario WebApp -->
  <div id="contenedor-iframe" class="hidden fixed inset-0 w-full h-full bg-white z-50">
    <iframe id="iframe-webapp" class="w-full h-full border-none" src=""></iframe>
  </div>

  <script>
    // URL del ejecutable de la Web App Principal
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyla23f7O9c7SRzkouNEuTeKS-zzxksM0Nn7nkeZVcZ7mQ_GNOpRrPAU-ckQBKRjcdG/exec";
    const FORMULARIO_URL = "https://script.google.com/macros/s/AKfycbyla23f7O9c7SRzkouNEuTeKS-zzxksM0Nn7nkeZVcZ7mQ_GNOpRrPAU-ckQBKRjcdG/exec";

    let perfilDataActual = null;

    // Función callback global para procesar respuesta de Google Apps Script
    window.procesarRespuestaServidor = function(data) {
      const btn = document.getElementById('btn-validar');
      const seccionPerfil = document.getElementById('seccion-perfil');

      btn.disabled = false;
      btn.innerText = "Ingresar / Validar Perfil";

      // Eliminar el script inyectado temporalmente
      const tagScriptTemp = document.getElementById('jsonp-script-temp');
      if (tagScriptTemp) tagScriptTemp.remove();

      if (data.exito) {
        mostrarMensaje("¡Perfil verificado correctamente!", "bg-green-100 text-green-700");
        perfilDataActual = data.usuario;

        document.getElementById('perfil-iglesia').innerText = data.usuario.iglesia;
        document.getElementById('perfil-ministro').innerText = data.usuario.ministro;
        document.getElementById('perfil-grado').innerText = data.usuario.grado;
        document.getElementById('perfil-rol').innerText = data.usuario.rol;

        seccionPerfil.classList.remove('hidden');
      } else {
        seccionPerfil.classList.add('hidden');
        mostrarMensaje(data.mensaje, "bg-red-100 text-red-700");
      }
    };

    function validarCorreo() {
      const correo = document.getElementById('input-correo').value.trim();
      const pass = document.getElementById('input-pass').value.trim();
      const btn = document.getElementById('btn-validar');

      if (!correo) {
        mostrarMensaje("Por favor ingresa tu correo institucional.", "bg-red-100 text-red-700");
        return;
      }

      if (!pass) {
        mostrarMensaje("Por favor ingresa tu contraseña.", "bg-red-100 text-red-700");
        return;
      }

      btn.disabled = true;
      btn.innerText = "Verificando credenciales...";
      mostrarMensaje("Consultando directorio...", "bg-yellow-100 text-yellow-800");

      // Limpiar script viejo si existía
      const viejoScript = document.getElementById('jsonp-script-temp');
      if (viejoScript) viejoScript.remove();

      // Inyección JSONP para saltar restricciones CORS
      const script = document.createElement('script');
      script.id = 'jsonp-script-temp';
      script.src = `${SCRIPT_URL}?correo=${encodeURIComponent(correo)}&pass=${encodeURIComponent(pass)}&callback=procesarRespuestaServidor`;
      
      script.onerror = function() {
        btn.disabled = false;
        btn.innerText = "Ingresar / Validar Perfil";
        mostrarMensaje("No se pudo conectar con el servidor. Revisa la conexión.", "bg-red-100 text-red-700");
      };

      document.body.appendChild(script);
    }

    function irAFormulario() {
      if (!perfilDataActual) return;
      
      const contenedorIframe = document.getElementById('contenedor-iframe');
      const iframe = document.getElementById('iframe-webapp');

      // Pasamos la iglesia como parámetro en la URL del iframe
      const urlConIglesia = `${FORMULARIO_URL}?iglesia=${encodeURIComponent(perfilDataActual.iglesia)}`;
      
      iframe.src = urlConIglesia;
      contenedorIframe.classList.remove('hidden');
    }

    function mostrarMensaje(texto, clases) {
      const msg = document.getElementById('mensaje-estado');
      msg.className = `text-xs text-center p-2 rounded-lg ${clases}`;
      msg.innerText = texto;
      msg.classList.remove('hidden');
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
