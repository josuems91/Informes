<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Distrito 2 - Ingreso</title>

  <link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/1OL4fcqW6-tv4hJ5PSO7fMdtME0pOF1nU">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#1a365d">
  <link rel="manifest" href="manifest.json">

  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #f3f4f6;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-2 sm:p-4">

  <!-- Card Principal -->
  <div id="card-validacion" class="bg-white rounded-2xl shadow-xl w-full max-w-md p-6 border border-gray-200 my-auto">
    
    <div class="text-center mb-6">
      <img src="https://lh3.googleusercontent.com/d/1OL4fcqW6-tv4hJ5PSO7fMdtME0pOF1nU" alt="Escudo D2" class="w-20 h-20 mx-auto mb-2 object-contain">
      <h1 class="text-xl font-bold text-blue-900">Distrito 2 - Costa Rica</h1>
      <p class="text-xs text-gray-500">Validación de Perfil Ministerial</p>
    </div>

    <!-- Módulo Login -->
    <div class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-gray-700 mb-1">Correo Institucional</label>
        <input type="email" id="input-correo" placeholder="ejemplo@lldm.org" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 text-sm text-gray-800">
      </div>

      <div>
        <label class="block text-xs font-bold text-gray-700 mb-1">Contraseña</label>
        <input type="password" id="input-pass" placeholder="••••••••" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 text-sm text-gray-800">
      </div>
      
      <button onclick="validarEIngresar()" id="btn-validar" class="w-full bg-blue-900 hover:bg-blue-800 text-white font-semibold py-2.5 rounded-lg transition duration-200 shadow-md">
        Ingresar / Validar Perfil
      </button>

      <div id="mensaje-estado" class="text-xs text-center hidden p-2 rounded-lg"></div>
    </div>

  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyla23f7O9c7SRzkouNEuTeKS-zzxksM0Nn7nkeZVcZ7mQ_GNOpRrPAU-ckQBKRjcdG/exec";

    function validarEIngresar() {
      const correo = document.getElementById('input-correo').value.trim();
      const pass = document.getElementById('input-pass').value.trim();
      const btn = document.getElementById('btn-validar');

      if (!correo || !pass) {
        mostrarMensaje("Por favor ingresa tu correo y contraseña.", "bg-red-100 text-red-700");
        return;
      }

      btn.disabled = true;
      btn.innerText = "Verificando credenciales...";
      mostrarMensaje("Consultando directorio...", "bg-blue-100 text-blue-800");

      // Consultar Apps Script de manera directa
      fetch(`${SCRIPT_URL}?correo=${encodeURIComponent(correo)}&pass=${encodeURIComponent(pass)}`)
        .then(response => response.json())
        .then(data => {
          if (data.exito) {
            mostrarMensaje("¡Perfil verificado! Redirigiendo al formulario...", "bg-green-100 text-green-800 font-bold");
            const iglesiaEscapada = encodeURIComponent(data.usuario.iglesia || '');
            
            setTimeout(() => {
              window.location.href = `${SCRIPT_URL}?iglesia=${iglesiaEscapada}`;
            }, 800);
          } else {
            btn.disabled = false;
            btn.innerText = "Ingresar / Validar Perfil";
            mostrarMensaje(data.mensaje || "Credenciales incorrectas.", "bg-red-100 text-red-700");
          }
        })
        .catch(error => {
          btn.disabled = false;
          btn.innerText = "Ingresar / Validar Perfil";
          mostrarMensaje("Error al conectar con el servidor. Intenta nuevamente.", "bg-red-100 text-red-700");
        });
    }

    function mostrarMensaje(texto, clases) {
      const msg = document.getElementById('mensaje-estado');
      msg.className = `text-xs text-center p-2 rounded-lg ${clases}`;
      msg.innerText = texto;
      msg.classList.remove('hidden');
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
