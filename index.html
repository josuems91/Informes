<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Distrito 2 - Costa Rica</title>

  <!-- Enlace al Manifest para Habilitar Instalación PWA -->
  <link rel="manifest" href="./manifest.json">

  <!-- Configuraciones para Navegadores Móviles -->
  <meta name="theme-color" content="#1e3a8a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Distrito 2">
  <link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/1OL4fcqW6-tv4hJ5PSO7fMdtME0pOF1nU">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f8fafc;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <!-- iFrame con la nueva URL desplegada de Google Apps Script -->
  <iframe src="https://script.google.com/macros/s/AKfycbw7v-iU0tCN2YHwBzMCNAX_vZEbTZMgDktYeBc7Nkzd9Ahu-FLSszSKsT9FzSKDEQMC/exec" allow="geolocation; microphone; camera"></iframe>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('SW activo:', reg.scope))
          .catch(err => console.log('Error SW:', err));
      });
    }
  </script>

</body>
</html>
